<script>
  // PATCHED (see README-vendored.md): load Monaco's loader only once. A deck
  // with WebR cells has already loaded it (same version), and a second copy
  // throws "_amdLoaderGlobal has already been declared".
  if (typeof globalThis.require === "undefined" || !globalThis.require.config) {
    document.write('<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.47.0/min/vs/loader.js"><\/script>');
  }
</script>
<script type="module" id="qpyodide-monaco-editor-init">

  // Configure the Monaco Editor's loader
  require.config({
    paths: {
      'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.47.0/min/vs'
    }
  });
</script>
